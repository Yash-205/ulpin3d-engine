# Stage 2 (v2): adapt to Indian drone imagery without forgetting what correct outlines look like.
#   ramp Karnataka (human labels, satellite)  +  OAM India drone scenes (registered Google/Microsoft labels)
#   + a little ramp/OAM South Asia replay.  Selection on human-labelled ramp Karnataka val.
data:
  chips_root: [data/footprint/chips_reg, data/footprint/chips_ramp]
  gsd: 0.15
  chip_px: 512
  crop_px: 512
  train_filter: {split: [train], region: [india, south_asia]}
  val_filter: {split: [val], source: [ramp], region: [india]}
  max_val_chips: 600
  sample_by: [source, region]
  sample_weights: {ramp/india: 2.0, oam/india: 1.5, ramp/south_asia: 0.7, oam/south_asia: 0.3}
  aug_strength: strong
model:
  arch: Unet
  encoder: efficientnet-b4
  encoder_weights: imagenet
train:
  out_dir: runs/footprint_stage2_india
  init_checkpoint: runs/footprint_stage1/best.pt
  epochs: 16
  steps_per_epoch: 300
  batch_size: 12
  lr: 0.0001
  encoder_lr_mult: 0.3
  freeze_encoder_epochs: 2
  num_workers: 4
  amp: true
  select_metric: obj_f1
  early_stop_patience: 6
loss: {w_building: 1.0, w_dice: 1.0, w_boundary: 1.0, boundary_pos_weight: 3.0}
postprocess: {mask_thr: 0.5, seed_thr: 0.55, min_area_m2: 6.0, conf_validated: 0.85, conf_provisional: 0.60}
